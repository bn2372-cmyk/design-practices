# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# Turning layers on and off. Every layer with a `label:` gets a checkbox in
# the layer panel (top right). `visible: false` starts a layer switched off.
# Shown on src/pages/inline_maps.mdx.
type: map
id: layer-toggles
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-73.9654, 40.7829]
  zoom: 13

layers:
  # A polygon written straight into the YAML (no data file needed).

  - id: squirrels
    type: circle
    label: Squirrel sightings
    source:
      type: geojson
      url: "/data/squirrel20241021.geojson"
    paint:
      circle-radius: 3
      circle-color: "#c0642f"
    legend: { label: Squirrel sightings, color: "#c0642f", shape: circle }

  - id: Rhode Island_historic sites
    type: circle
    label: Historic Sites
    source:
      type: geojson
      url: "/data/RI_HistoricSites.geojson"
    paint:
      circle-radius: 4
      circle-stroke-width: 1
      circle-stroke-color: "#ffffff"
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - str: "Name: "
              - property: NAME
              - else: "(not recorded)"
          - p:
              - str: "Town: "
              - property: TOWN
                else: "(not recorded)"