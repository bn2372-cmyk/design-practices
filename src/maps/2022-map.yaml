# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx: it fills the window under the site
# header, with zoom and reset buttons, a legend and a layer panel.
type: map
id: full-page
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-71, 41.1]
  zoom: 8

# Where the legend sits: top-left (default), top-right, bottom-left, bottom-right.
legend:
  position: bottom-left

layers:
  # Vector tiles from OpenFreeMap (free, no key): the same tiles the basemap
  # draws, here only their building shapes, in a colour of your own.
  # Starts switched off; tick it in the layer panel.

  - id: Rhode_Island_historic_sites
    type: circle
    label: Historic Sites
    source:
      type: geojson
      url: "/data/RI-HistoricSites.geojson"
    paint:
      circle-radius: 2
      circle-stroke-width: 1
      circle-stroke-color: "#FF0000"
      circle-color: "#FF0000"
      circle-opacity: 0.5
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - str: "Name: "
              - property: NAME
              - else: "(not recorded)"
          - p:
              - str: "Town: "
              - property: TOWN
                else: "(not recorded)"

  - id: Rhode_Island_historic_candidates
    type: fill
    label: Historic Candidates
    source:
      type: geojson
      url: "/data/RI-HistoricCandidates.geojson"
    paint:
      fill-color: "#FF0000"
      fill-opacity: 0.5
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - str: "Name: "
              - property: SITENAME1
              - else: "(not recorded)"

  - id: Rhode_Island_historic_districts
    type: fill
    label: Historic Districts
    source:
      type: geojson
      url: "/data/RI-HistoricDistricts.geojson"
    paint:
      fill-color: "#FF0000"
      fill-opacity: 0.5
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - str: "Name: "
              - property: NAME
              - else: "(not recorded)"
          - p:
              - str: "Town: "
              - property: TOWN
                else: "(not recorded)"

  - id: Turbines_2021
    type: circle
    source:
      type: geojson
      url: "/data/CONSTRUCTION_BEGIN_2021.geojson"
    paint:
      circle-radius: 2
      circle-stroke-width: 1
      circle-stroke-color: "#0000FF"
      circle-opacity: 0.5
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - str: "Project Name: "
              - property: PROJECT_NAME
          - p:
              - str: "Operation Year: "
              - property: COMMISSION_BEGIN
                else: "(not recorded)"

  - id: Turbines_2022
    type: circle
    source:
      type: geojson
      url: "/data/CONSTRUCTION_BEGIN_2022.geojson"
    paint:
      circle-radius: 2
      circle-stroke-width: 1
      circle-stroke-color: "#0000FF"
      circle-opacity: 0.5
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - str: "Project Name: "
              - property: PROJECT_NAME
          - p:
              - str: "Operation Year: "
              - property: COMMISSION_BEGIN
                else: "(not recorded)"